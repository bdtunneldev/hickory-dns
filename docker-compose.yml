# Pinned images (update deliberately, not :latest):
#   hickory-dns     — built from Dockerfile (rust:1-alpine3.24 → alpine:3.24.1)
#   haproxy         — haproxytech/haproxy-alpine:3.5
#   prometheus      — prom/prometheus:v3.12.0

x-hickory-dns-common: &hickory-dns-common
  build: .
  image: hickory-dns:latest
  volumes:
    - ./config:/config
  environment:
    TZ: Asia/Dhaka
  restart: unless-stopped
  command: -c /config/routedns-pipeline.toml -z /config/
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/metrics"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  hickory-dns-1:
    <<: *hickory-dns-common
    ports:
      - "9101:9000/tcp"
      - "53:53/udp"

  hickory-dns-2:
    <<: *hickory-dns-common
    ports:
      - "9102:9000/tcp"

  hickory-dns-3:
    <<: *hickory-dns-common
    ports:
      - "9103:9000/tcp"

  haproxy:
    image: haproxytech/haproxy-alpine:3.5
    environment:
      TZ: Asia/Dhaka
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "53:53/tcp"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      hickory-dns-1:
        condition: service_healthy
      hickory-dns-2:
        condition: service_healthy
      hickory-dns-3:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    environment:
      TZ: Asia/Dhaka
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - hickory-dns-1
      - hickory-dns-2
      - hickory-dns-3
    restart: unless-stopped

global
    log stdout format raw local0
    maxconn 50000

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# TCP DNS — PROXY v2 to Hickory for real client IP / tenant TLV
frontend dns_tcp_in
    bind *:53
    mode tcp
    option tcplog
    default_backend hickory_dns_tcp

backend hickory_dns_tcp
    mode tcp
    balance roundrobin
    option httpchk
    http-check connect port 9000
    http-check send meth GET uri /metrics ver HTTP/1.0 hdr Host localhost
    http-check expect status 200
    server dns1 hickory-dns-1:53 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2
    server dns2 hickory-dns-2:53 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2
    server dns3 hickory-dns-3:53 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2

# UDP DNS: haproxytech/haproxy-alpine does not ship UDP mode — Hickory :53/udp
# is published directly on hickory-dns-1 (see docker-compose.yml).
